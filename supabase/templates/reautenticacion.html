<!--
  Reautenticación (código de 6 dígitos).
  Se pega en: Supabase → Authentication → Emails → Templates → "Reauthentication".

  ⚠️ ESTE NO LLEVA BOTÓN A PROPÓSITO: Supabase manda un CÓDIGO, no un enlace
  (`{{ .Token }}`). La alumna lo copia y lo escribe en la pantalla donde lo pidió.
  Hoy la app no lo usa; está aquí para que la casilla no quede con el texto de
  otra marca.

  Paleta: la guia de marca de design-ref/07-guia-de-marca.png (crema #FBF6EE ·
  marfil #FFFDF9 · espresso #2A1F19 · dorado #8C6A2F sobre claro).
  ⚠️ El dorado sobre crema es SIEMPRE #8C6A2F. El claro (#D9B97A) solo vale
  dentro del boton, donde el fondo ya es oscuro por el degradado.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Tu código de confirmación · Manos Creadoras</title>
  </head>
  <body style="margin:0; padding:0; background-color:#FBF6EE;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      Tu código de confirmación.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#FBF6EE; margin:0; padding:0;">
      <tr>
        <td align="center" style="padding:32px 16px;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:480px; width:100%;">

            <tr>
              <td align="center" style="padding-bottom:24px;">
                <p style="margin:0; font-family:'Manrope',Helvetica,Arial,sans-serif; font-size:12px;
                          letter-spacing:3px; text-transform:uppercase; color:#8C6A2F;">
                  Manos Creadoras
                </p>
              </td>
            </tr>

            <tr>
              <td style="background-color:#FFFDF9; border:1px solid #E5D6BF; border-radius:24px;
                         padding:32px 28px;">

                <h1 style="margin:0 0 12px; font-family:Georgia,'Cormorant Garamond','Times New Roman',serif;
                           font-weight:400; font-size:28px; line-height:1.25; color:#2A1F19;">
                  Tu código de confirmación
                </h1>

                <p style="margin:0 0 24px; font-family:'Manrope',Helvetica,Arial,sans-serif;
                          font-size:15px; line-height:1.6; color:#5E4D40;">
                  Escribe este código en la pantalla donde te lo pidió la app. Vence pronto.
                </p>

                <!-- El código, grande y separado, para que se pueda leer de un vistazo
                     y copiar sin equivocarse. -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" bgcolor="#1c1712" style="border-radius:16px;
                        background-color:#1c1712; border:1px solid #E5D6BF; padding:20px 16px;">
                      <p style="margin:0; font-family:'Courier New',Courier,monospace;
                                font-size:32px; font-weight:700; letter-spacing:8px; color:#D9B97A;">
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding-top:24px;">
                <p style="margin:0 0 6px; font-family:'Manrope',Helvetica,Arial,sans-serif;
                          font-size:12px; line-height:1.6; color:#6B5A4C;">
                  Si no pediste este código, ignora este correo y no se lo compartas a nadie.
                </p>
                <p style="margin:0; font-family:'Manrope',Helvetica,Arial,sans-serif;
                          font-size:12px; color:#6B5A4C;">
                  Manos Creadoras · Bolsos de lujo en cuentas
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
